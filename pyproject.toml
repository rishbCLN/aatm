[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aatm"
version = "0.1.0"
description = "Agent Action Transaction Manager - a runtime safety/recovery layer around AI-agent tool calls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AATM Contributors" }]
keywords = ["agents", "saga", "transactions", "compensation", "reliability"]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.90",
    # Shared Assurance Contract v1 validators/schemas. Installed editable from
    # ../orch_bench/assurance_contract; used by tests/test_contract_conformance.py.
    "assurance-contract>=1.0.0,<2.0.0",
]

[project.scripts]
aatm = "aatm.cli.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aatm = ["reporting/templates/*.html", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.aatm]
# Project-level marker; runtime config lives in src/aatm/config.py
